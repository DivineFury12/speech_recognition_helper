services:
  gigaam:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8000:8000"
    environment:
      - GIGAAM_MODEL=${GIGAAM_MODEL:-v3_e2e_rnnt}
      - GIGAAM_DEVICE=cpu
      - HF_TOKEN=${HF_TOKEN:-}
      - GIGACHAT_AUTH_KEY=${GIGACHAT_AUTH_KEY:-}
      - GIGACHAT_SCOPE=${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat-2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      - GIGACHAT_CA_BUNDLE=${GIGACHAT_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
      - POSTGRES_HOST=db
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-assistant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-assistant}
      - POSTGRES_DB=${POSTGRES_DB:-assistant}
      - TTS_MODEL_DIR=/cache/tts
      - DATA_DIR=/cache/data
      - VOICE_ENABLED=${VOICE_ENABLED:-true}
      - ACCESS_CODE=${ACCESS_CODE:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
    volumes:
      - model-cache:/cache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app:app --host 0.0.0.0 --port 8000"]

  frontend:
    build: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - gigaam
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-assistant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-assistant}
      - POSTGRES_DB=${POSTGRES_DB:-assistant}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  model-cache:
  postgres-data:
