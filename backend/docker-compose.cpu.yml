services:
  gigaam:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8000:8000"
    environment:
      - GIGAAM_MODEL=${GIGAAM_MODEL:-v3_e2e_rnnt}
      - GIGAAM_DEVICE=cpu
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - model-cache:/cache
    restart: unless-stopped

volumes:
  model-cache:
