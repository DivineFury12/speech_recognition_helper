services:
  assistant:
    build:
      context: .
      target: cpu
    image: speech-assistant:cpu
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      - DB_PATH=/data/assistant.db
      - FRONTEND_DIST=/app/frontend
      - ACCESS_CODE=${ACCESS_CODE:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - GIGAAM_DEVICE=cpu
      - TTS_DEVICE=cpu
    volumes:
      - assistant-data:/data
    restart: unless-stopped

volumes:
  assistant-data:
